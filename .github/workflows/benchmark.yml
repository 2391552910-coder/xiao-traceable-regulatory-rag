name: Frozen benchmark checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-eval.txt
      - run: pip install -r requirements-eval.txt -r requirements-data.txt
      - run: python -m pytest -q
      - run: python scripts/compile_independent_review.py --check
      - run: python scripts/validate_preparation_release.py
      - run: python scripts/audit_benchmark.py --output-dir results/runs/ci_audit
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-audit
          path: results/runs/ci_audit/
