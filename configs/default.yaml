# ============ 默认实验配置 ============
seed: 42

# 知识库
knowledge_base:
  path: data/knowledge_base
  chunking: clause        # clause（条款级切分，本方法）| window（512字滑窗，消融对照）
  window_size: 512
  window_overlap: 64

# 检索
retrieval:
  top_k: 5
  vector_weight: 0.7      # 混合检索融合权重：w·向量 + (1-w)·BM25
  embedding_model: Qwen/Qwen3-Embedding-4B   # M4/16GB 建议 Q4 量化加载（约2.8GB），跑不动可换 Qwen/Qwen3-Embedding-0.6B
  embedding_device: mps                        # Apple Silicon 用 mps（Metal），其余用 cpu/cuda
  embedding_backend: qwen  # qwen | bge | tfidf（离线冒烟测试）| api（远端服务）
  # —— 模型部署在另一台电脑时改用 api 后端（本机零显存）——
  # embedding_backend: api
  # embedding_base_url: http://192.168.1.10:8000/v1   # vLLM/Xinference/Ollama 的 OpenAI 兼容地址
  # embedding_api_key: ""                              # 远端服务密钥（如有），建议用环境变量
  reranker:
    enabled: true
    model: Qwen/Qwen3-Reranker-0.6B          # fp16 约1.2GB，16GB 统一内存可与 4B embedding 共存
    device: mps
    pool_factor: 4          # 精排候选 = top_k × pool_factor
    # url: http://192.168.1.10:9997/v1       # 填则走远端重排服务，忽略本地加载
  dimension_routing: true # 维度路由检索（本方法）| false（消融对照）

# 大模型（OpenAI 兼容接口）
llm:
  base_url: https://api.deepseek.com/v1
  api_key: ""             # 运行时读取环境变量 LLM_API_KEY
  model: deepseek-chat
  temperature: 0.2
  mock: true              # true=离线模板响应（冒烟测试），false=真实调用

# 生成评测
generation:
  modes: [no_rag, naive_rag, ours]   # 三组对照
  judge_model: deepseek-chat         # LLM-as-judge 评分模型
  judge_rubric: [faithfulness, coverage, professionalism]

# 实验
experiment:
  retrieval_repeats: 1
  generation_repeats: 3              # 生成重复 3 次取均值（温度 0.2 仍有随机性）
  results_dir: results
